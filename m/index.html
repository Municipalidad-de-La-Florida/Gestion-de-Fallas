<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fallas Alumbrado</title>
<meta name="theme-color" content="#1f4d3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fallas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="pantallaLogin" class="pantalla" hidden>
  <form id="formLogin" class="login-caja" autocomplete="on">
    <img src="icon-192.png" alt="" class="login-logo" width="84" height="84">
    <h1>Fallas Alumbrado</h1>
    <p class="login-sub">La Florida</p>
    <label for="loginEmail">Correo</label>
    <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" required>
    <label for="loginPass">Contraseña</label>
    <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" class="btn btn-primario" type="submit">Entrar</button>
    <button id="loginOlvido" class="btn-link" type="button">Olvidé mi contraseña</button>
    <p id="loginError" class="error" role="alert" hidden></p>
  </form>
</section>

<!-- ============ APP ============ -->
<section id="pantallaApp" class="pantalla" hidden>
  <header id="barra">
    <div id="barraAvatar" class="barra-avatar" aria-hidden="true"></div>
    <div class="barra-titulo">
      <b id="barraNombre">—</b>
      <span id="barraRol" class="rol-chip"></span>
    </div>
    <button id="btnActualizar" class="icon-btn" aria-label="Actualizar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button id="btnMenu" class="icon-btn" aria-label="Menú" style="display:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <button id="avisoVersion" class="chip-modo" hidden style="width:100%"></button>
  <button id="chipModo" class="chip-modo insp" hidden></button>


  <main id="vistaMapa">
    <div id="map"></div>
    <div id="zoomAviso" class="zoom-aviso" hidden>Acércate más para ver y tocar los puntos</div>
    <button id="badgeSinAsignar" class="badge-filtro" hidden>Solo sin asignar ✕</button>
    <button id="badgeCamiones" class="badge-filtro" style="top:52px" hidden>Camiones ✕</button>
    <button id="btnUbicacion" class="fab" aria-label="Mi ubicación"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
    <button id="btnComuna" class="fab fab2 activo" aria-label="Atenuar fuera de la comuna" aria-pressed="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg></button>
    <button id="btnDistrib" class="fab fab3 activo" aria-label="Fallas de distribución" aria-pressed="true" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M12.8 7.5l-3 5h3l-1 4 3.2-5.2h-3z" fill="currentColor" stroke="none"/></svg></button>
  </main>

  <main id="vistaInsp" hidden>
    <div class="lista-filtros"><div id="inspC3Resumen" class="hint"></div></div>
    <div id="inspC3Items"></div>
  </main>

  <main id="vistaLista" hidden>
    <div class="lista-filtros">
      <div class="lf-fila">
        <input id="listaBuscar" type="search" placeholder="Buscar OS, llave, código…" autocomplete="off">
        <button type="button" id="btnFiltrosLista" class="lf-btn" aria-label="Filtros" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span id="filtrosListaNum" class="lf-num" hidden>0</span></button>
      </div>
      <div id="filtrosListaPanel" class="lf-panel" hidden>
        <div class="lf-t">Estado</div>
        <div class="lf-chips" id="listaChips">
          <button type="button" class="fchip" data-e="reportada"><i class="fdot"></i>Reportada</button>
          <button type="button" class="fchip" data-e="pendiente"><i class="fdot"></i>Pendiente</button>
          <button type="button" class="fchip" data-e="reiterada"><i class="fdot"></i>Reiterada</button>
        </div>
        <div id="listaOrdenGrupo">
          <div class="lf-t">Ordenar por</div>
          <div class="lf-chips" id="listaOrden">
            <button type="button" class="fchip fchip-sel on" data-orden="cerca">Cercanía</button>
            <button type="button" class="fchip fchip-sel" data-orden="recientes">Más recientes</button>
            <button type="button" class="fchip fchip-sel" data-orden="antiguas">Más antiguas</button>
          </div>
        </div>
        <div id="listaAsigGrupo" hidden>
          <div class="lf-t" style="margin-top:12px">Asignación</div>
          <div class="lf-chips" id="listaAsig">
            <button type="button" class="fchip fchip-sel on" data-asig="todas">Todas</button>
            <button type="button" class="fchip fchip-sel" data-asig="sin">Sin asignar <b id="listaSinAsignarN"></b></button>
            <button type="button" class="fchip fchip-sel" data-asig="asignadas">Asignadas <b id="listaAsignadasN"></b></button>
          </div>
        </div>
        <div class="lf-t" style="margin-top:12px">Subcontrato</div>
        <div class="lf-chips" id="listaSub">
          <button type="button" class="fchip fchip-sel on" data-sub="todas">Todas</button>
          <button type="button" class="fchip fchip-sel" data-sub="masivo">Masivo <b id="listaMasivoN"></b></button>
          <button type="button" class="fchip fchip-sel" data-sub="normal">Normal <b id="listaNormalN"></b></button>
        </div>
        <div class="lf-pie"><button type="button" id="filtrosListaLimpiar" class="btn-link" style="padding:0">Limpiar filtros</button></div>
      </div>
      <div id="listaResumen" class="hint"></div>
    </div>
    <div id="listaItems"></div>
  </main>

  <nav id="navInferior">
    <button class="nav-btn sel" data-vista="mapa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg>Mapa</button>
    <button class="nav-btn" data-vista="lista"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Activas <i id="navCuenta" class="cuenta" hidden>0</i></button>
    <button id="navInspC3" class="nav-btn" data-vista="insp" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Inspecciones</button>
    <button id="navInsp" class="nav-btn" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Inspección</button>
    <button id="navCuad" class="nav-btn" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="12" height="9" rx="1.5"/><path d="M14 11h4l3 3v3h-7z"/><circle cx="6.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg>Cuadrillas</button>
    <button id="navMas" class="nav-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</button>
  </nav>
</section>

<!-- ============ GESTIÓN DE USUARIOS (solo admin) ============ -->
<section id="pantallaUsuarios" class="pantalla" hidden>
  <header class="u-bar"><button id="uAtras" class="icon-btn" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="u-bar-t" id="uTitulo"></div><div class="u-bar-t">Usuarios</div><button id="uMas" class="icon-btn" aria-label="Agregar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header>
  <nav id="uTabs" class="u-tabs"></nav>
  <div id="uCuerpo" class="u-cuerpo"></div>
</section>

<!-- ============ CUADRILLAS (admin o con permiso) ============ -->
<section id="pantallaCuad" class="pantalla" hidden>
  <header class="u-bar"><button id="cuAtras" class="icon-btn" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="u-bar-t">Cuadrillas</div><button id="cuMapa" class="icon-btn" aria-label="Ver camiones en el mapa" style="font-size:13px;font-weight:700;width:auto;padding:0 10px">📍 Camiones</button></header>
  <div class="cu-filtros"><input type="date" id="cuFecha"><select id="cuTurno"><option value="0">00–08</option><option value="1">08–16</option><option value="2">16–24</option><option value="d">Día</option></select><select id="cuSel"></select></div>
  <div id="cuCuerpo" class="u-cuerpo"></div>
</section>

<!-- ============ HOJA INFERIOR ============ -->
<div id="velo" hidden></div>
<aside id="hoja" hidden role="dialog" aria-modal="true">
  <div class="hoja-asa"></div>
  <button id="hojaCerrar" class="hoja-x" aria-label="Cerrar">✕</button>
  <div id="hojaContenido"></div>
</aside>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
